{% extends 'base.html' %}    
{% block 'main'%}  
<div class="tm-main-content tm-gallery-container">                   

<h1 class="alert-success">Photos</h1>

<form action="/rawfiles/savepic" method="post" enctype="multipart/form-data">
<div class="row mt-3">
    <div class="col-xl-4 col-lg-4">
        <input type="file" name="file" class="form-control" multiple required>
    </div>
    <div class="col-xl-8 col-lg-8">
        <button class="btn btn-success">Save Image</button>
    </div>
</div>
</form>
<hr>
<h3 class="alert-info">Image Records</h3>
<table class="table">
    <thead>
        <tr>
            <th>Date</th>
            <th>Image</th>
        </tr>
    </thead>
    <tbody>
        {% for rec in records %}
            <tr>
                <td>{{rec.date}}</td>
                <td>
                    <img src="/static/{{rec.image}}" class="sm-img">
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock 'main' %}
