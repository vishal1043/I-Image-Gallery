<!DOCTYPE html>
<html lang="en">
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>I Image Bucket</title>
    <!-- load stylesheets -->
    <link rel="stylesheet" href="fonts.googleapis.com/css?family=Open+Sans:300,400"> <!-- Google web font "Open Sans", https://fonts.google.com/ -->
    <link rel="stylesheet" href="/static/font-awesome-4.7.0/css/font-awesome.min.css">         <!-- Font Awesome, http://fontawesome.io/ -->
    {% comment %} <link rel="stylesheet" href="/static/css/bootstrap.min.css">                               <!-- Bootstrap styles, https://getbootstrap.com/ --> {% endcomment %}
    <link rel="stylesheet" href="/static/css/style.css">                            <!-- Templatemo style -->

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
        <!--[if lt IE 9]>
          <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
          <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
          <![endif]-->

          <style>
            .sm-img{
                height:100px;
                width:100px;
            }
            .faceimg{
                height:200px;
                width:200px;
            }
          </style>
      </head>

      <body>
    <div class="container-fluid">
        <div class="tm-body">
{% block 'sidebar'%}

        
           
                <div class="tm-sidebar sticky">
                    <section id="welcome" class="tm-content-box tm-banner margin-b-15">
                        <div class="tm-banner-inner">
                            <h1 class="tm-banner-title">I-image Bucket</h1>                 
                        </div>                    
                    </section>
                    <nav class="tm-main-nav">
                        <ul class="tm-main-nav-ul">
                            <li class="tm-nav-item"><a href="/" class="tm-nav-item-link tm-button active">Home</a>
                            </li>
                            <li class="tm-nav-item"><a href="/uploads" class="tm-nav-item-link tm-button active">Photos</a>
                            </li>
                            <li class="tm-nav-item"><a href="/facecutter" class="tm-nav-item-link tm-button active">Faces</a>
                            </li>
                        </ul>
                    </nav>
                </div>
{% endblock 'sidebar' %}
{% block 'main'%}

{% endblock 'main' %}
</div>

          
</div> <!-- container-fluid -->
<!-- load JS files -->
        
<script src="/static/js/jquery-1.11.3.min.js"></script>             <!-- jQuery (https://jquery.com/download/) -->
<script src="/static/js/imagesloaded.pkgd.min.js"></script> <!-- https://masonry.desandro.com/ -->
<script src="/static/js/masonry.pkgd.min.js"></script> <!-- https://masonry.desandro.com/ -->

<!-- Templatemo scripts -->
<script>  

$(document).ready(function(){

    // init Masonry
    // https://codepen.io/craigwheeler/pen/MYjBga
    var $grid = $('.grid').masonry({
        
        // set itemSelector so .grid-sizer is not used in layout
        // itemSelector: '.grid-item',
        // use element for option
        // columnWidth: '.grid-sizer',
        // percentPosition: true

        itemSelector: '.grid-item',
        isFitWidth: true,
        columnWidth: 1
    });
    // layout Masonry after each image loads
    $grid.imagesLoaded().progress( function() {
      $grid.masonry('layout');
    });            

    // Update the current year in copyright
    $('.tm-current-year').text(new Date().getFullYear());        
});

</script>
</body>
</html>
